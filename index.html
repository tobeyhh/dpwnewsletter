<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DPW Newsletter Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#eef3f8;--panel:#fff;--ink:#14263a;--mute:#5b6b7c;--line:#d5dfe9;--blue:#1678bd;--navy:#0a5282;--sky:#33c3f0;--gold:#f9ce0f;--amber:#f8a61b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a26;--panel:#16263a;--ink:#e6eef7;--mute:#95a7ba;--line:#2a3d55}}
:root[data-theme="dark"]{--bg:#0f1a26;--panel:#16263a;--ink:#e6eef7;--mute:#95a7ba;--line:#2a3d55}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Archivo",system-ui,sans-serif}
.app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:24px;padding:24px;max-width:1280px;margin:0 auto}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:14px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel h2{margin:0 0 12px;font-size:17px}
label{display:block;font-weight:500;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
textarea{resize:vertical;min-height:84px}
.sec{border-top:1px solid var(--line);margin-top:14px;padding-top:6px}
input[type=color]{padding:2px;height:36px;width:42px;cursor:pointer;flex:none}
.strow{display:grid;grid-template-columns:78px 1fr 42px auto;gap:8px;margin-top:8px}
.sechead{display:flex;gap:8px;align-items:center;margin-top:8px}
.sechead input{font-weight:700}
button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:9px 14px;cursor:pointer;background:var(--blue);color:#fff}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.stage{overflow-x:auto}
#paper{width:800px;background:#fff;color:#14263a;margin:0 auto}
.band{display:flex;height:12px}.band i{flex:1}
.head{display:flex;align-items:center;gap:22px;padding:28px 44px 20px}
.head img{height:74px;width:auto}
.head .t{flex:1}
.head h1{margin:0;font:800 30px/1.05 "Archivo";color:#0a5282;letter-spacing:-.01em}
.head p{margin:4px 0 0;font:500 14px "Archivo";color:#5b6b7c}
.meta{display:flex;justify-content:space-between;padding:10px 44px;background:#eaf4fb;font:500 13px "Archivo";color:#0a5282;border-top:3px solid #f9ce0f}
.body{padding:30px 44px 8px}
.body h2.hl{margin:0 0 14px;font:800 34px/1.1 "Archivo";color:#14263a}
.body .lead{font:400 16.5px/1.65 "Source Serif 4",serif;white-space:pre-wrap;margin:0}
.stats{margin-top:26px;border-top:3px solid #0a5282;padding-top:12px}.stats h3{margin:0 0 10px;font:700 19px "Archivo";color:#0a5282}.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.sg div{background:#eaf4fb;border-bottom:4px solid #1678bd;padding:12px 10px;text-align:center}.sg div:nth-child(even){border-bottom-color:#f8a61b;background:#fff8e1}.sg b{display:block;font:800 36px/1 "Archivo";color:#0a5282}.sg span{display:block;margin-top:6px;font:500 13px/1.25 "Archivo";color:#14263a}
.block{margin-top:26px;padding-left:16px;border-left:5px solid #1678bd}
.block:nth-of-type(even){border-left-color:#f8a61b}
.block h3{margin:0 0 6px;font:700 19px "Archivo";color:#0a5282}
.block p{margin:0;font:400 15.5px/1.6 "Source Serif 4",serif;white-space:pre-wrap}
.sign{padding:28px 44px 30px;font:400 15.5px/1.5 "Source Serif 4",serif}
.sign b{display:block;font:700 18px "Archivo";color:#0a5282;margin-top:20px}
.sign span{display:block;font:500 14px/1.45 "Archivo";color:#5b6b7c}
.foot{background:#0a5282;color:#fff;padding:20px 44px;display:grid;grid-template-columns:auto 1fr 1fr;gap:26px;align-items:start;font:400 13.5px/1.45 "Archivo"}
.foot b{display:block;font:700 12.5px "Archivo";color:#f9ce0f;margin-bottom:3px}
.foot .n{font:800 30px/1 "Archivo";color:#fff}
</style></head><body>
<div class="app">
<div class="panel" id="form">
<h2>Newsletter details</h2>
<label for="issue">Issue label</label><input id="issue" value="DPW Newsletter #1">
<label for="date">Date</label><input id="date">
<label for="hl">Headline</label><input id="hl" value="Keeping Los Santos Moving">
<label for="lead">Opening message</label><textarea id="lead" rows="5">The Department of Public Works continues to maintain the roads, utilities and public spaces that residents rely on every day. This edition covers the current work across the state of San Andreas and recent recognition for our dedicated staff.</textarea>

<div id="secs"></div>

<label for="by">Signed by</label><input id="by" value="Wyatt Sawyer">
<label for="role">Title</label><input id="role" value="Public Information Technician">

function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function drawStats(){$("stats").innerHTML=stats.map(function(s,i){return '<div class="strow"><input data-si="'+i+'" data-sk="n" aria-label="Number" value="'+esc(s.n).replace(/"/g,"&quot;")+'"><input data-si="'+i+'" data-sk="l" aria-label="What was fixed" value="'+esc(s.l).replace(/"/g,"&quot;")+'"><input type="color" data-si="'+i+'" data-sk="c" aria-label="Tile colour" value="'+s.c+'"><button class="ghost" type="button" data-rs="'+i+'" aria-label="Remove statistic">Remove</button></div>'}).join("")}
